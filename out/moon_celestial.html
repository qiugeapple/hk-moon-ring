<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>2026 月相与月球运行天象图</title>
<style>
  :root {
    --bg: #030712;
    --card: #0b1120;
    --text-pri: #f8fafc;
    --text-sec: #94a3b8;
    --rise: #34d399;
    --trans: #fde047;
    --set: #f43f5e;
    --full-moon: #e0f2fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 30px 20px;
    background: radial-gradient(circle at 50% 10%, #172554 0%, #030712 60%);
    color: var(--text-pri);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card {
    background: rgba(11, 17, 32, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 24px 30px;
    position: relative;
    box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
    backdrop-filter: blur(16px);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 20px;
  }
  .title-box h2 {
    margin: 0 0 6px 0;
    font-weight: 300;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #fff 40%, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title-box p {
    margin: 0;
    font-size: 13px;
    color: var(--text-sec);
    letter-spacing: 0.5px;
  }
  .legend {
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: var(--text-sec);
    align-items: center;
  }
  .leg-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.6;
    color: #f8fafc;
    display: none;
    box-shadow: 0 16px 36px rgba(0,0,0,0.7), 0 0 1px rgba(255,255,255,0.4);
    transform: translate(16px, -50%);
    backdrop-filter: blur(10px);
    z-index: 100;
    min-width: 170px;
  }
  .moon-icon {
    font-size: 14px;
    margin-right: 4px;
  }
</style>
</head>

  const PLOT_W = 1110;
  const PLOT_H = 400;
  const PAD_L = 60;
  const PAD_T = 75;

  const overlay = document.getElementById("overlay");
  const chart = document.getElementById("chart");
  const crossX = document.getElementById("crossX");
  const snapRise = document.getElementById("snapRise");
  const snapTrans = document.getElementById("snapTrans");
  const snapSet = document.getElementById("snapSet");
  const tooltip = document.getElementById("tooltip");

  function timeToFrac(t) {
    if(!t || !t.includes(":")) return null;
    const [h, m] = t.split(":").map(Number);
    return (h + m / 60.0) / 24.0;
  }

  function getMoonEmoji(illum, age) {
    if (age < 1.5 || age > 28) return "🌑 新月 (New Moon)";
    if (age >= 1.5 && age < 6.5) return "🌒 蛾眉月 (Waxing Crescent)";
    if (age >= 6.5 && age < 8.5) return "🌓 上弦月 (First Quarter)";
    if (age >= 8.5 && age < 13.5) return "🌔 盈凸月 (Waxing Gibbous)";
    if (age >= 13.5 && age < 16) return "🌕 满月 / 望 (Full Moon)";
    if (age >= 16 && age < 21) return "🌖 亏凸月 (Waning Gibbous)";
    if (age >= 21 && age < 23) return "🌗 下弦月 (Last Quarter)";
    return "🌘 残月 (Waning Crescent)";
  }

  overlay.addEventListener("mousemove", (e) => {
    const rect = chart.getBoundingClientRect();
    const mouseX = e.clientX - rect.left - PAD_L;
    if (mouseX < 0 || mouseX > PLOT_W) return;

    const idx = Math.min(data.length - 1, Math.max(0, Math.round((mouseX / PLOT_W) * (data.length - 1))));
    const d = data[idx];
    if(!d) return;

    const snapX = (idx / data.length) * PLOT_W;
    crossX.setAttribute("x1", snapX);
    crossX.setAttribute("x2", snapX);
    crossX.style.display = "block";

    // 动态附着点
    const fr = timeToFrac(d.rise);
    const ft = timeToFrac(d.trans);
    const fs = timeToFrac(d.set);

    function positionDot(el, frac) {
      if(frac !== null) {
        el.setAttribute("cx", snapX);
        el.setAttribute("cy", frac * PLOT_H);
        el.style.display = "block";
      } else {
        el.style.display = "none";
      }
    }
    positionDot(snapRise, fr);
    positionDot(snapTrans, ft);
    positionDot(snapSet, fs);

    // Tooltip
    tooltip.style.display = "block";
    tooltip.style.left = (e.clientX - rect.left) + "px";
    tooltip.style.top = (e.clientY - rect.top) + "px";

    const moonDesc = getMoonEmoji(d.illum, d.moon_age);
    tooltip.innerHTML = `
      <div style="font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px;">
        ${d.date}
      </div>
      <div style="color: #cbd5e1; margin-bottom: 6px;">
        ${moonDesc}<br/>
        <span style="color:#94a3b8">月亮照亮比例:</span> <span style="color:#fde047; font-weight:600;">${d.illum}%</span>
      </div>
      <div><span style="color:var(--rise)">● 月出:</span> ${d.rise || '未升起'}</div>
      <div><span style="color:var(--trans)">● 中天:</span> ${d.trans || '未过中天'}</div>
      <div><span style="color:var(--set)">● 月落:</span> ${d.set || '未落下'}</div>
    `;
  });

  overlay.addEventListener("mouseleave", () => {
    crossX.style.display = "none";
    snapRise.style.display = "none";
    snapTrans.style.display = "none";
    snapSet.style.display = "none";
    tooltip.style.display = "none";
  });
